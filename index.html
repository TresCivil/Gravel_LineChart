<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production vs Haulage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f8; --card:#ffffff; --border:#e6e6ee;
    --ink:#1f2433; --ink-2:#5b6478; --ink-3:#8a92a6;
    --grid:#ececf2; --axis:#d9dbe4;
    --seg-bg:#eeeff4; --seg-on:#ffffff;
    --prod:#7A55C7; --haul:#0B7FA6;
    --tip-bg:#1f2433; --tip-ink:#ffffff; --tip-ink-2:#c3c8d6;
    --fill-op-top:.22; --fill-op-bot:0; --ring:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      --bg:#121317; --card:#1a1b20; --border:#2a2c34;
      --ink:#eceef4; --ink-2:#a4abbd; --ink-3:#7c8396;
      --grid:#262830; --axis:#33363f;
      --seg-bg:#24262d; --seg-on:#34373f;
      --prod:#9B7BE8; --haul:#2E9BBD;
      --tip-bg:#f1f2f6; --tip-ink:#1a1b20; --tip-ink-2:#5b6478;
      --fill-op-top:.28; --ring:#1a1b20;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121317; --card:#1a1b20; --border:#2a2c34;
    --ink:#eceef4; --ink-2:#a4abbd; --ink-3:#7c8396;
    --grid:#262830; --axis:#33363f;
    --seg-bg:#24262d; --seg-on:#34373f;
    --prod:#9B7BE8; --haul:#2E9BBD;
    --tip-bg:#f1f2f6; --tip-ink:#1a1b20; --tip-ink-2:#5b6478;
    --fill-op-top:.28; --ring:#1a1b20;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:transparent;color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:8px;display:flex}
  .card{background:transparent;border:0;padding:4px 6px;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--ink-2);font-size:13px;margin:0}
  .badge{display:inline-block;margin-left:8px;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--seg-bg);color:var(--ink-2);vertical-align:middle}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .seg{display:flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--ink-2);font:600 13px Inter,system-ui,sans-serif;padding:6px 13px;border-radius:8px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg button:focus-visible{outline:2px solid var(--prod);outline-offset:1px}
  .plot{position:relative;flex:1;min-height:0;margin-top:14px}
  svg{display:block;width:100%;height:100%;overflow:visible}
  .tick{fill:var(--ink-3);font-size:11px}
  .endlbl{font-size:11px;font-weight:600;fill:var(--ink)}
  .tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:8px 10px;font-size:12px;white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .08s}
  .tip .d{color:var(--tip-ink-2);margin-bottom:4px;font-weight:500}
  .tip .r{display:flex;align-items:center;gap:6px}
  .tip .r b{margin-left:auto;padding-left:14px;font-weight:600}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
  .sw.sq{border-radius:2px}.sw.ci{border-radius:50%}
  .legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;color:var(--ink-2);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend b{color:var(--ink);font-weight:600}
  .empty{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px}
  .sr{position:fixed;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div>
      <h1><span id="title">Production vs Haulage — monthly tonnes</span><span id="demo" class="badge" hidden>Demo data</span></h1>
      <p class="sub" id="sub">Crushing Production Log vs Removal &amp; Haulage Log</p>
    </div>
    <div class="ctrls">
      <div class="seg" id="segGrain" role="group" aria-label="Group by">
        <button data-g="year" aria-pressed="false">Year</button>
        <button data-g="month" aria-pressed="true">Month</button>
        <button data-g="day" aria-pressed="false">Day</button>
      </div>
    </div>
  </div>
  <div class="plot" id="plot">
    <svg id="svg" role="img" aria-labelledby="title sub"></svg>
    <div class="tip" id="tip"></div>
    <div class="empty" id="empty" hidden>No records in this period</div>
  </div>
  <div class="legend">
    <span><i class="sw sq" style="background:var(--prod)"></i>Tonnes produced (crushed) <b id="totP"></b></span>
    <span><i class="sw ci" style="background:var(--haul)"></i>Tonnes removed (hauled) <b id="totH"></b></span>
  </div>
  <table class="sr" id="sr"></table>
</div>

<script>
/* ============================================================
   Production vs Haulage — tonnes by Year / Month (categorical x-axis)
   Data arrives in the URL hash as EncodeUrl(JSON({...})) from Power Fx:
     { p:[{d:"2026-10-01", t:123.4}, ...],   // production, DAILY totals, last 30 days (Day view)
       h:[{d:"2026-10-01", t: 98.0}, ...],   // haulage,    DAILY totals, last 30 days
       pm:[{d:"2025-07", t:4567.8}, ...],    // production, MONTHLY totals ("yyyy-mm" or "yyyy-mm-dd")
       hm:[{d:"2025-07", t:3456.7}, ...],    // haulage,    MONTHLY totals
       ytd:"fy" | "cal",                     // year basis for Year view, default "fy" (1 July)
       grain:"day" | "month" | "year",       // optional starting view, default month
       today:"2026-10-19", title:"...", theme:"dark" }   // all optional
   Without pm / hm, Month and Year are rolled up from the daily rows.
   No hash → demo data so the page can be previewed on its own.
   ============================================================ */
(function(){
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  let state = { grain:"month", data:null, picked:{} };
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const pad2 = n => String(n).padStart(2,"0");
  const key = dt => dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());
  const mkey = dt => dt.getFullYear()+"-"+pad2(dt.getMonth()+1);
  const parse = s => { const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(String(s||"")); return m ? new Date(+m[1], +m[2]-1, +(m[3]||1)) : null; };
  const addDays = (dt,n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n);
  const fmtT = v => (Math.round(v*10)/10).toLocaleString("en-AU",{maximumFractionDigits:1});
  const fmtDL = dt => dt.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

  function toMap(rows, keyFn){
    const m = new Map();
    (rows||[]).forEach(r=>{
      const d = Array.isArray(r) ? r[0] : (r.d ?? r.Date ?? r.date);
      const t = Array.isArray(r) ? r[1] : (r.t ?? r.Tonnes ?? r.tonnes);
      const dt = parse(d); const v = Number(t);
      if(!dt || !isFinite(v)) return;
      const k = keyFn(dt); m.set(k, (m.get(k)||0) + v);
    });
    return m;
  }
  const rollMonths = dayMap => { const m = new Map(); dayMap.forEach((v,k)=>{ const mk=k.slice(0,7); m.set(mk,(m.get(mk)||0)+v); }); return m; };

  function readHash(){
    const raw = location.hash.replace(/^#/,"");
    if(!raw) return null;
    try { return JSON.parse(decodeURIComponent(raw)); }
    catch(e){ try { return JSON.parse(raw); } catch(e2){ console.warn("Bad payload", e2); return null; } }
  }

  function demo(){
    const today = new Date(); const p=[], h=[];
    for(let i=900;i>=0;i--){
      const d = key(addDays(today,-i)); const base = 300 + (900-i)*0.5;
      if(addDays(today,-i).getDay()===0) continue;           // no Sunday crushing
      p.push({d, t: base + (i%2 ? 40 : -10) + Math.random()*20});
      h.push({d, t: base*0.8 + (i%2 ? 25 : -15) + Math.random()*20});
    }
    return {p,h,ytd:"fy"};
  }

  function load(){
    const payload = readHash();
    const src = payload || demo();
    $("demo").hidden = !!payload;
    const today = parse(src.today) || (()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
    const pD = toMap(src.p, key), hD = toMap(src.h, key);
    state.data = {
      pD, hD,
      pM: src.pm ? toMap(src.pm, mkey) : rollMonths(pD),
      hM: src.hm ? toMap(src.hm, mkey) : rollMonths(hD),
      ytd: (src.ytd||"fy").toLowerCase(), today, title: src.title || null
    };
    if(src.theme) document.documentElement.setAttribute("data-theme", src.theme);
    if(src.grain && !state.picked.grain) setGrain(String(src.grain).toLowerCase(), false);
    render();
  }

  const fyStart = dt => dt.getMonth() >= 6 ? dt.getFullYear() : dt.getFullYear()-1;
  const yearOf = dt => state.data.ytd === "cal" ? dt.getFullYear() : fyStart(dt);
  const yearLbl = y => state.data.ytd === "cal" ? String(y) : "FY" + String(y).slice(2) + "–" + String(y+1).slice(2);
  const yearLong = y => state.data.ytd === "cal" ? "Calendar year " + y : "Financial year " + y + "–" + String(y+1).slice(2);

  /* Build the categories for the current view: [{lbl, long, P, H}] */
  function buckets(){
    const D = state.data, t = D.today;
    if(state.grain === "day"){
      const out = [];
      for(let d=addDays(t,-29); d<=t; d=addDays(d,1)){
        out.push({ lbl: d.getDate()+" "+MON[d.getMonth()], long: fmtDL(d),
                   P: D.pD.get(key(d))||0, H: D.hD.get(key(d))||0 });
      }
      return out;
    }
    if(state.grain === "month"){
      const out = [];
      for(let i=11;i>=0;i--){
        const d = new Date(t.getFullYear(), t.getMonth()-i, 1), k = mkey(d);
        out.push({ lbl: MON[d.getMonth()]+" '"+String(d.getFullYear()).slice(2),
                   long: MONL[d.getMonth()]+" "+d.getFullYear() + (i===0 ? " (to date)" : ""),
                   P: D.pM.get(k)||0, H: D.hM.get(k)||0 });
      }
      return out;
    }
    // year
    const sums = new Map(); let minY = yearOf(t);
    const add = (map, side) => map.forEach((v,k)=>{
      const y = yearOf(parse(k)); if(y < minY) minY = y;
      const b = sums.get(y) || {P:0,H:0}; b[side] += v; sums.set(y,b);
    });
    add(D.pM,"P"); add(D.hM,"H");
    const out = [], curY = yearOf(t);
    for(let y=minY; y<=curY; y++){
      const b = sums.get(y) || {P:0,H:0};
      out.push({ lbl: yearLbl(y), long: yearLong(y) + (y===curY ? " (to date)" : ""), P:b.P, H:b.H });
    }
    return out;
  }

  function setGrain(g, user){
    if(!["year","month","day"].includes(g)) return;
    state.grain = g; if(user) state.picked.grain = true;
    document.querySelectorAll("#segGrain button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.g===g));
  }

  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(e); return e;
  }
  function niceMax(v){
    if(v<=0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p;
    return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
  }
  function niceStep(v){
    if(v<=0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p;
    return [1,1.5,2,2.5,3,4,5,6,8,10].find(k=>n<=k) * p;
  }

  function render(){
    if(!state.data) return;
    const B = buckets(), n = B.length;
    const P = B.map(b=>b.P), H = B.map(b=>b.H);
    const totP = P.reduce((a,b)=>a+b,0), totH = H.reduce((a,b)=>a+b,0);
    const unit = {day:"daily", month:"monthly", year:"yearly"}[state.grain];

    $("title").textContent = state.data.title || ("Production vs Haulage — " + unit + " tonnes");
    let span;
    if(state.grain === "day") span = "last 30 days";
    else if(state.grain === "month") span = "last 12 months";
    else span = state.data.ytd === "cal" ? "by calendar year" : "by financial year";
    $("sub").textContent = "Crushing Production Log vs Removal & Haulage Log, " + span;
    $("totP").textContent = fmtT(totP)+" t"; $("totH").textContent = fmtT(totH)+" t";
    $("empty").hidden = (totP+totH) > 0;

    const svg = $("svg"); svg.innerHTML = "";
    const W = $("plot").clientWidth, Hh = $("plot").clientHeight;
    const m = {l:48, r:56, t:8, b:24};
    const iw = Math.max(10, W-m.l-m.r), ih = Math.max(10, Hh-m.t-m.b);
    svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);

    const yt = (Hh-m.t-m.b) < 90 ? 1 : (Hh-m.t-m.b) < 160 ? 2 : 4;
    const ystep = niceStep(Math.max(...P, ...H) * 1.05 / yt);   // round step: 5,000 / 2,500 / 250 …
    const ymax = ystep * yt;
    const bw = iw / n;                                  // band width per category
    const x = i => m.l + (i + 0.5) * bw;                // category centre
    const y = v => m.t + ih - (v/ymax)*ih;

    const cs = getComputedStyle(document.documentElement);
    const defs = el("defs",{},svg);
    [["gP","--prod"],["gH","--haul"]].forEach(([id,c])=>{
      const g = el("linearGradient",{id,x1:0,y1:0,x2:0,y2:1},defs);
      el("stop",{offset:"0%","stop-color":`var(${c})`,"stop-opacity":cs.getPropertyValue("--fill-op-top").trim()},g);
      el("stop",{offset:"100%","stop-color":`var(${c})`,"stop-opacity":cs.getPropertyValue("--fill-op-bot").trim()||0},g);
    });

    // hover band (behind marks)
    const band = el("rect",{y:m.t,height:ih,width:bw,fill:"var(--ink)","fill-opacity":0.05,visibility:"hidden"},svg);

    // grid + y ticks
    for(let i=0;i<=yt;i++){
      const v = ymax*i/yt, yy = y(v);
      el("line",{x1:m.l,x2:m.l+iw,y1:yy,y2:yy,stroke:i===0?"var(--axis)":"var(--grid)","stroke-width":1},svg);
      const t = el("text",{x:m.l-8,y:yy+4,"text-anchor":"end",class:"tick"},svg); t.textContent = fmtT(v);
    }

    // categorical x labels: one per category, thinned evenly only if they'd collide
    const lblW = state.grain === "year" ? 64 : state.grain === "month" ? 50 : 44;
    const every = Math.max(1, Math.ceil(lblW / bw));
    for(let i=0;i<n;i++){
      el("line",{x1:x(i),x2:x(i),y1:m.t+ih,y2:m.t+ih+(i%every===0?4:2),stroke:"var(--axis)","stroke-width":1},svg);
      if(i % every) continue;
      const t = el("text",{x:x(i),y:m.t+ih+17,"text-anchor":"middle",class:"tick"},svg);
      t.textContent = B[i].lbl;
    }

    // series
    const path = arr => arr.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
    const area = arr => path(arr)+`L${x(n-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
    if(n > 1){
      el("path",{d:area(P),fill:"url(#gP)"},svg);
      el("path",{d:area(H),fill:"url(#gH)"},svg);
      el("path",{d:path(P),fill:"none",stroke:"var(--prod)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
      el("path",{d:path(H),fill:"none",stroke:"var(--haul)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
    }
    // point markers on each category when there's room (always for Month / Year)
    if(bw >= 14){
      for(let i=0;i<n;i++){
        el("rect",{x:x(i)-4,y:y(P[i])-4,width:8,height:8,rx:2,fill:"var(--prod)",stroke:"var(--ring)","stroke-width":1.5},svg);
        el("circle",{cx:x(i),cy:y(H[i]),r:4,fill:"var(--haul)",stroke:"var(--ring)","stroke-width":1.5},svg);
      }
    }

    // direct end labels (latest category), nudged apart
    let yP = y(P[n-1]), yH = y(H[n-1]);
    if(Math.abs(yP-yH) < 14){ const mid=(yP+yH)/2, up = P[n-1]>=H[n-1]; yP = mid+(up?-7:7); yH = mid+(up?7:-7); }
    const ex = Math.min(x(n-1) + Math.max(8, bw/2 + 4), m.l + iw + 6);
    el("text",{x:ex,y:yP+4,class:"endlbl"},svg).textContent = fmtT(P[n-1]);
    el("text",{x:ex,y:yH+4,class:"endlbl"},svg).textContent = fmtT(H[n-1]);

    // hover layer
    const dotP = el("rect",{width:10,height:10,rx:2,fill:"var(--prod)",stroke:"var(--ring)","stroke-width":2,visibility:"hidden"},svg);
    const dotH = el("circle",{r:5.5,fill:"var(--haul)",stroke:"var(--ring)","stroke-width":2,visibility:"hidden"},svg);
    const hit = el("rect",{x:m.l,y:m.t,width:iw,height:ih+m.b,fill:"transparent"},svg);
    const tip = $("tip");
    const show = (evt)=>{
      const r = svg.getBoundingClientRect();
      const px = (evt.touches?evt.touches[0].clientX:evt.clientX) - r.left;
      const i = Math.max(0, Math.min(n-1, Math.floor((px-m.l)/bw)));
      const xx = x(i);
      band.setAttribute("x", m.l + i*bw);
      dotP.setAttribute("x",xx-5); dotP.setAttribute("y",y(P[i])-5);
      dotH.setAttribute("cx",xx); dotH.setAttribute("cy",y(H[i]));
      [band,dotP,dotH].forEach(e=>e.setAttribute("visibility","visible"));
      const diff = P[i]-H[i];
      tip.innerHTML = `<div class="d">${B[i].long}</div>
        <div class="r"><i class="sw sq" style="background:var(--prod)"></i>Produced<b>${fmtT(P[i])} t</b></div>
        <div class="r"><i class="sw ci" style="background:var(--haul)"></i>Hauled<b>${fmtT(H[i])} t</b></div>
        <div class="r" style="color:var(--tip-ink-2)">Net to stockpile<b style="color:var(--tip-ink)">${diff>=0?"+":""}${fmtT(diff)} t</b></div>`;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = xx + bw/2 + 8; if(left+tw > W) left = xx - bw/2 - tw - 8;
      left = Math.max(0, left);
      const top = Math.max(0, Math.min(Hh-th, Math.min(y(P[i]),y(H[i])) - th/2));
      tip.style.left = left+"px"; tip.style.top = top+"px"; tip.style.opacity = 1;
    };
    const hide = ()=>{ [band,dotP,dotH].forEach(e=>e.setAttribute("visibility","hidden")); tip.style.opacity = 0; };
    hit.addEventListener("mousemove",show); hit.addEventListener("touchstart",show,{passive:true});
    hit.addEventListener("touchmove",show,{passive:true}); hit.addEventListener("mouseleave",hide);

    // screen-reader table
    $("sr").innerHTML = `<caption>${unit} tonnes</caption><tr><th>Period</th><th>Produced</th><th>Hauled</th></tr>` +
      B.map(b=>`<tr><td>${b.long}</td><td>${fmtT(b.P)}</td><td>${fmtT(b.H)}</td></tr>`).join("");
  }

  document.querySelectorAll("#segGrain button").forEach(b=>b.addEventListener("click",()=>{ setGrain(b.dataset.g,true); render(); }));
  window.addEventListener("hashchange", load);
  new ResizeObserver(()=>render()).observe($("plot"));
  load();
})();
</script>
</body>
</html>
